<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap Demo</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="p-3">

  <!-- Image -->
  <img src="https://images.pexels.com/photos/17060790/pexels-photo-17060790.jpeg" class="img-fluid" alt="Responsive image">

  <!-- Heading -->
  <h1>Bootstrap Heading 1</h1>
  <p class="lead">This is a lead paragraph for prominent text</p>

  <!-- Buttons -->
  <button class="btn btn-danger">Primary button</button>
  <button class="btn btn-outline-secondary btn-sm">Small outline button</button>

  <!-- Badge Button -->
  <button class="btn btn-primary">
    Notifications <span class="badge bg-danger">4</span>
  </button>

  <div id="carouselExampleSlidesOnly"
     class="carousel slide mt-3"
     data-bs-ride="carousel"
     data-bs-interval="2000">

  <div class="carousel-inner">

    <div class="carousel-item active">
      <img
        src="https://images.pexels.com/photos/3114350/pexels-photo-3114350.jpeg"
        class="d-block w-100"
        alt="image1">
    </div>

    <div class="carousel-item">
      <img
        src="https://images.pexels.com/photos/32847481/pexels-photo-32847481.jpeg"
        class="d-block w-100"
        alt="image2">
    </div>

  </div>
</div>
  <!-- Progress Bar -->
  <div class="progress mt-3">
    <div class="progress-bar" role="progressbar" style="width: 75%;" 
         aria-valuenow="75" aria-valuemin="0" aria-valuemax="100">
      75%
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
